server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Habilitar compresión gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # DNS embebido de Docker (presente en las redes de docker compose):
    # permite resolver el servicio 'backend' EN RUNTIME (no al arrancar).
    resolver 127.0.0.11 valid=10s ipv6=off;

    # API Gateway / Reverse Proxy: todas las peticiones /api/ van al backend interno.
    # Se usa el nombre del servicio ('backend', alias DNS de la red compose) en lugar
    # de un container_name fijo, para que funcione igual en el stack activo
    # (proyecto 'taskflow') y en el de respaldo ('taskflow-previous').
    # El upstream es DINÁMICO (variable): nginx no muere al arrancar si el
    # backend aún no está disponible (responde 502 solo en /api/ y reintenta
    # en la siguiente petición); además se re-resuelve periódicamente, por lo
    # que sobrevive a recreaciones del contenedor backend (IP nueva).
    location /api/ {
        set $backend_upstream http://backend:8080;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Versión global de la plataforma: /version.js se genera en cada arranque
    # del contenedor (docker-entrypoint.d), nunca debe cachearse.
    location = /version.js {
        add_header Cache-Control "no-store, must-revalidate";
    }

    # Cache estático agresivo para assets con hash
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Fallback SPA: cualquier ruta no estática sirve index.html.
    # 'no-cache' obliga al navegador a REVALIDAR el HTML en cada carga:
    # así siempre toma el index (y el bundle) de la versión desplegada y
    # nunca queda pegado a un index.html viejo (p. ej. sin /version.js).
    # Los assets con hash se cachean 1 año en su propia location.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    # Bloquear acceso a archivos ocultos
    location ~ /\. {
        deny all;
    }
}
