# ============================================================
# Docker Compose de TaskFlow (monorepo)
# ------------------------------------------------------------
#
# Uso:
#   docker compose up -d          # levantar (proyecto: taskflow)
#   docker compose down           # parar
#   docker compose down -v        # parar y borrar datos de la BD
#
# Arquitectura: Frontend/Nginx actúa como API Gateway en puerto 80
# y hace proxy de /api/ al backend interno (sin CORS / sin exponer backend).
#
# Despliegue resiliente (Jenkins -> VM2):
#   - Proyecto ACTIVO : 'taskflow'          (stack en producción)
#   - Proyecto STANDBY: 'taskflow-previous' (respaldo ':previous' en espera,
#     usado para rollback automático si el healthcheck del backend falla)
#   - NO se usa container_name fijo: el standby debe poder crear sus propios
#     contenedores (taskflow-previous-*) sin colisionar con los del activo.
#   - El volumen 'taskflow-db-data' tiene nombre fijo para que ambos
#     proyectos compartan los datos de PostgreSQL.
# ============================================================

name: taskflow

services:
  # ---------- Base de datos PostgreSQL ----------
  db:
    # Imagen controlada por Jenkins: solo se recarga en VM2 si cambia su
    # configuración (bloque db del compose) o su versión de imagen.
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    environment:
      POSTGRES_DB: ${DB_NAME:-taskflow}
      POSTGRES_USER: ${DB_USERNAME:-taskflow}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-taskflow}
    ports:
      # Expuesto por si quieres conectarte con un cliente externo (DBeaver, pgAdmin…)
      - "${DB_HOST_PORT:-5432}:5432"
    volumes:
      - taskflow-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  # ---------- Backend (Spring Boot) ----------
  backend:
    image: ${BACKEND_IMAGE:-taskflow-backend:latest}
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db                # alias DNS del servicio dentro de la red compose
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-taskflow}
      DB_USERNAME: ${DB_USERNAME:-taskflow}
      DB_PASSWORD: ${DB_PASSWORD:-taskflow}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-*}
    restart: unless-stopped
    # El backend NO se expone al host: el acceso externo pasa por el gateway (frontend/nginx)

  # ---------- Frontend + API Gateway (React + Nginx) ----------
  frontend:
    image: ${FRONTEND_IMAGE:-taskflow-frontend:latest}
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-80}:80"
    restart: unless-stopped

volumes:
  taskflow-db-data:
    name: taskflow-db-data
